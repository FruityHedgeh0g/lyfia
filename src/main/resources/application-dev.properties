quarkus.quinoa.enable=false
quarkus.test.continuous-testing=disabled
quarkus.log.level=WARN

# Disable all Dev Services (no Docker locally)
quarkus.devservices.enabled=false

quarkus.oidc.roles.source=accesstoken

quarkus.datasource.dev-ui.allow-sql=true

# H2 file DB (path is relative to project root, file created automatically)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/urueDB;AUTO_SERVER=TRUE

# No Keycloak in dev: no login and no admin client; people are tried out through personas
# (DevPersonaController, DevPersonaAuthentication) and Keycloak calls go to DevKeycloakStandIns
# OIDC stays built in (it provides the injected token), with no tenant: nobody logs in through Keycloak
quarkus.oidc.tenant-enabled=false
quarkus.keycloak.admin-client.enabled=false
