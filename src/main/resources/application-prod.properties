quarkus.log.level=WARN

quarkus.datasource.dev-ui.allow-sql=false

# Flyway owns the schema; Hibernate only checks the entities against it (ADR 0005)
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Behind the reverse proxy, which terminates TLS: the redirects to and from Keycloak must use its https address
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true

# Every production build writes the OpenAPI document to docs/api/, so the API reference follows the code
quarkus.smallrye-openapi.store-schema-directory=docs/api
quarkus.smallrye-openapi.auto-add-server=false
# The API is protected by path (quarkus.http.auth.permission.*), which the scanner cannot see: META-INF/openapi.yaml declares it
quarkus.smallrye-openapi.auto-add-security=false
