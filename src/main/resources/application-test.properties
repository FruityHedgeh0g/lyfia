quarkus.test.continuous-testing=enabled
quarkus.log.level=DEBUG

quarkus.datasource.dev-ui.allow-sql=true

# In-memory database for @QuarkusTest
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1

# No external services under test: RabbitMQ is never contacted, OIDC is replaced by @TestSecurity
quarkus.devservices.enabled=false
quarkus.quinoa.enable=false
rabbitmq.enabled=false
# Injected as an int even though the connection is never opened
rabbitmq.port=5672
quarkus.oidc.tenant-enabled=false

